name: Aktualizacja Grafiku

on:
  schedule:
    - cron: '0 */4 * * *' # Uruchamia się co 4 godziny
  workflow_dispatch:      # Pozwala uruchomić skrypt ręcznie z panelu GitHuba

permissions:
  contents: write         # Wymagane, aby bot mógł zapisać plik w repozytorium

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalacja zależności
        run: |
          pip install playwright icalendar pytz
          playwright install chromium
          
      - name: Uruchomienie scrapera
        env:
          MY_LOGIN: ${{ secrets.MY_LOGIN }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          MY_PESEL: ${{ secrets.MY_PESEL }}
        run: python scraper.py
        
      - name: Zapisanie pliku .ics do repozytorium
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add grafik.ics
          git commit -m "Zaktualizowano grafik" || echo "Brak zmian w grafiku"
          git push
